	"src/lib/deskflow/ProtocolTypes.h",
	"src/lib/deskflow/ProtocolTypes.cpp",
	"src/lib/deskflow/ProtocolUtil.cpp",
	"src/lib/deskflow/ClipboardChunk.cpp",
	"src/lib/deskflow/ClipboardTypes.h",
	"src/lib/deskflow/IClipboard.cpp",
	"src/lib/deskflow/IClipboard.h",
	"src/lib/client/Client.cpp",
	"src/lib/client/ServerProxy.cpp",
	"src/lib/server/ClientProxyUnknown.cpp",
	"src/lib/server/ClientProxy1_0.cpp",
]

[package.metadata.licensing]
expression = "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"
exception-file = "LICENSE-OpenSSL-exception"